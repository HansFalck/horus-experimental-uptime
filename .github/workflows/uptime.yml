# Published to HansFalck/horus-experimental-uptime as .github/workflows/uptime.yml by publish.mjs
# (source of truth: starfleet-development tools/horus-experimental/uptime/). #470, #477.
# This is the RESTARTER, not the watcher: every 5 minutes (GitHub's cron, or the keeper's
# `gh workflow run uptime.yml`) it starts watch.yml if no watcher is queued or running.
# The watching itself (probes every 60 s, alerts, certificates) is watch.yml.
name: uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "Unused since #477 (kept so the keeper's dispatch stays valid)"
        required: false
      window_ms:
        description: "Unused since #477 (kept so the keeper's dispatch stays valid)"
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a watcher if none is running
        env:
          MODE: restart
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node check.mjs
      # GitHub disables scheduled workflows in a public repo after 60 days without a commit.
      # A tiny commit whenever the newest commit is 30+ days old keeps the schedule alive.
      - name: Keep-alive
        if: always() && github.event_name == 'schedule'
        run: |
          if [ $(( $(date -u +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > keepalive.txt
            git config user.name "uptime-keepalive"
            git config user.email "uptime-keepalive@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keep-alive $(date -u +%F)"
            git push
          fi
